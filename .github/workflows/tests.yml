name: Tests

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    name: Build docker image
    steps:
    - uses: actions/checkout@v4
    - run: make docker-build

  docker-lint:
    runs-on: ubuntu-latest
    name: 'dockerfile: lint'
    steps:
    - uses: actions/checkout@v4
    - run: make docker-lint
